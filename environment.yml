# Python environment used for the analyses (developed on macOS arm64, Python 3.13).
#   conda env create -f environment.yml
#   conda activate xai_ibd
# requirements-lock.txt lists every package of the original environment with exact versions.
name: xai_ibd
channels:
  - conda-forge
dependencies:
  - python=3.13
  - pip
  - pip:
      - torch==2.7.1
      - torch-geometric==2.8.0.post1
      - captum==0.9.0
      - scikit-learn==1.9.0
      - pandas==3.0.5
      - numpy==2.5.2
      - scipy==1.18.0
      - networkx==3.6.1
      - matplotlib==3.11.1
      - ipython==9.16.1
